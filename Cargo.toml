[workspace]
resolver = "2"
members = ["crates/cloud-api", "crates/cloud-contracts", "crates/cloud-verifier", "crates/cloud-client", "crates/cloud-storage", "crates/cloud-snapshot", "crates/devtools-core", "crates/devtools", "crates/cloud-peer-relay", "crates/cloud-versioning"]

# Password hashing (better-auth uses scrypt with a 32 MiB work factor) dominates
# the database test suite when compiled without optimizations: every sign-up
# and sign-in costs seconds in a debug build. Optimizing only these crates keeps
# the real scrypt parameters and speeds the suite up by more than 20x. They are
# small, so debug builds of everything else are unaffected.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.password-hash]
opt-level = 3

# Lore's workspace patches two crates that Cargo does not apply from a dependency's own
# workspace, so the consuming workspace repeats them, at the same Lore revision as the
# dependency in crates/cloud-versioning. See docs/VERSIONING-BUILD.md.
[patch.crates-io]
quinn-proto = { git = "https://github.com/nglmercer/lore.git", rev = "bfde21b7020719d4a7043e3a0289cfc37ebe79a7" }
glob-match = { git = "https://github.com/nglmercer/lore.git", rev = "bfde21b7020719d4a7043e3a0289cfc37ebe79a7" }
