[package]
name = "cloud-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[features]
# Cross-checkout fixture runner only; adds no production endpoints or bypasses.
native-peer-acceptance = []
# Compiled CLI scenario, separate so SDK-only acceptance needs no CLI artifact.
native-cli-acceptance = ["native-peer-acceptance"]

[dependencies]
cloud-contracts = { path = "../cloud-contracts" }
cloud-storage = { path = "../cloud-storage" }
cloud-verifier = { path = "../cloud-verifier" }
cloud-snapshot = { path = "../cloud-snapshot" }
tempfile = "3"
base64 = "0.22"
sha2 = "0.10"
tiktools-plugin-registry = { git = "https://github.com/nglmercer/TikTools-app.git", rev = "b24ddbe7c6dbf5c42b875c25f1c7cc5725e9f677" }
tiktools-plugin-api = { git = "https://github.com/nglmercer/TikTools-app.git", rev = "b24ddbe7c6dbf5c42b875c25f1c7cc5725e9f677" }
tiktools-plugin-package = { git = "https://github.com/nglmercer/TikTools-app.git", rev = "b24ddbe7c6dbf5c42b875c25f1c7cc5725e9f677" }
axum = { version = "0.8", features = ["ws"] }
ed25519-dalek = "2"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
better-auth = { git = "https://github.com/nglmercer/better-auth-rs.git", rev = "d4bb1ff17400d424813fc0bd8800204faf088238", default-features = false, features = ["axum", "sqlx"] }
better-auth-core = { git = "https://github.com/nglmercer/better-auth-rs.git", rev = "d4bb1ff17400d424813fc0bd8800204faf088238" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "uuid", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "io-util", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
ipnet = "2"
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
hex = "0.4"
hmac = "0.12"
aes-gcm = "0.10"
percent-encoding = "2"

[dev-dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "test-utils"] }
cloud-peer-relay = { path = "../cloud-peer-relay" }
tokio-tungstenite = "0.28"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }
cloud-client = { path = "../cloud-client" }
jsonwebtoken = "9"
better-auth = { git = "https://github.com/nglmercer/better-auth-rs.git", rev = "d4bb1ff17400d424813fc0bd8800204faf088238", default-features = false, features = ["axum", "sqlx", "test-utils"] }
tower = { version = "0.5", features = ["util"] }
tiktools-plugin-installer = { git = "https://github.com/nglmercer/TikTools-app.git", rev = "b24ddbe7c6dbf5c42b875c25f1c7cc5725e9f677" }
semver = "1.0.28"
